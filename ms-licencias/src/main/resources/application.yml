server:
  port: 8083
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: ms-licencias
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false
sri:
  base-url: ${SRI_BASE_URL:https://srienlinea.sri.gob.ec}
ant:
  url: ${ANT_URL:https://consultaweb.ant.gob.ec/PortalWEB/paginas/clientes/clp_grid_citaciones.jsp}
  points-selector: ${ANT_POINTS_SELECTOR:}
cache:
  hmac-secret: ${CACHE_HMAC_SECRET:}
redis:
  host: ${REDIS_HOST:}
  port: ${REDIS_PORT:6379}
  username: ${REDIS_USERNAME:default}
  password: ${REDIS_PASSWORD:}
  ssl: ${REDIS_SSL:true}

logging:
  level:
    root: INFO
    org.springframework.web: 'OFF'
    reactor.netty: WARN
    io.lettuce.core: WARN
