services:
  frontend-angular:
    build: ./frontend-angular
    ports: ["127.0.0.1:4200:80"]
    depends_on: [api-gateway]
  api-gateway:
    build: ./api-gateway
    ports: ["127.0.0.1:8080:8080"]
    environment:
      SERVER_ADDRESS: 0.0.0.0
      CONTRIBUYENTES_URL: http://ms-contribuyentes:8081
      VEHICULOS_URL: http://ms-vehiculos:8082
      LICENCIAS_URL: http://ms-licencias:8083
    depends_on: [ms-contribuyentes, ms-vehiculos, ms-licencias]
  ms-contribuyentes:
    build: ./ms-contribuyentes
    environment:
      SERVER_ADDRESS: 0.0.0.0
  ms-vehiculos:
    build: ./ms-vehiculos
    environment:
      SERVER_ADDRESS: 0.0.0.0
  ms-licencias:
    build: ./ms-licencias
    env_file: .env
    environment:
      SERVER_ADDRESS: 0.0.0.0
# Redis es exclusivamente Redis Cloud externo; no se sustituye por Redis local.
